<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Addiction - Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        
        /* Flask Background Image setup */
        background-image: url("{{ url_for('static', filename='images/signupbg.png') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      /* Spacing between inputs */
      .brutalist-container {
        margin-bottom: 38px;
      }

      /* Semi-Transparent Box Container */
      .form-container {
        background: rgba(0, 0, 0, 0.75); /* Dark semi-transparent background */
        backdrop-filter: blur(8px);       /* Glassmorphism blur effect */
        -webkit-backdrop-filter: blur(8px);
        
        padding: 55px 45px 25px 45px;
        border-radius: 12px;
        
        /* Matching brutalist box styling */
        border: 4px solid #000;
        box-shadow: 8px 8px 0px #4a90e2, 14px 14px 0px #000;
        
        width: 100%;
        max-width: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
</head>
<body>

<div class="form-container">
    <div class="brutalist-container">
      <input
        placeholder="Username"
        class="brutalist-input smooth-type"
        type="text"
      />
      <label class="brutalist-label">Username</label>
    </div>

    <div class="brutalist-container">
      <input
        placeholder="Email"
        class="brutalist-input smooth-type"
        type="text"
      />
      <label class="brutalist-label">Email</label>
    </div>

    <div class="brutalist-container">
      <input
        placeholder="Password"
        class="brutalist-input smooth-type"
        type="password"
      />
      <label class="brutalist-label">Password</label>
    </div>

    <div class="brutalist-container">
      <input
        placeholder="confirm Password"
        class="brutalist-input smooth-type"
        type="password"
      />
      <label class="brutalist-label">confirm Password</label>
    </div>

    <!-- From Uiverse.io by Z4drus --> 
    <div class="button-container">
      <button class="button-3d">
        <div class="button-top">
          <span class="material-icons">LOGIN</span>
        </div>
        <div class="button-bottom"></div>
        <div class="button-base"></div>
      </button>

      <button class="button-3d">
        <div class="button-top">
          <span class="material-icons">SIGN UP</span>
        </div>
        <div class="button-bottom"></div>
        <div class="button-base"></div>
      </button>
    </div>
</div>

</body>
</html>
